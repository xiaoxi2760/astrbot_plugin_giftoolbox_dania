name: astrbot_plugin_giftoolbox_dania  # 插件标识符，英文，唯一
display_name: 娅娅表情处理工具箱             # 插件展示名称
short_desc: GIF/APNG/WebP 图片处理工具箱，集成达妮娅(娅娅)风格文案与别名指令
desc: |
  娅娅表情处理工具箱：基于 GIF 工具箱二次风格化改造的 AstrBot 插件，集成《鸣潮》达妮娅（娅娅）风格文案与别名指令。

  ## 功能
  - 变速：倍速/帧率模式，>50fps 自动抽帧
  - 倒放 / 分解 / 裁剪
  - 表情包做旧 / 多图合成 / 精灵图合成（合成1 / 合成2）
  - 本地转线稿 / 视频转GIF
  - 大体积动图自动拆分发送，避免 QQ 图文混排把动图转成静态图

  ## 使用
  - 直接发指令，或加 yy/娅娅 前缀（如：娅娅加速5倍）
  - 回复图片/动图后再发指令
  - 发送「表情帮助」查看完整功能列表
